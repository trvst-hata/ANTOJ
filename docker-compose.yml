services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: antoj_mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: antoj_redis
    ports:
      - "6379:6379"

volumes:
  mssql_data:
